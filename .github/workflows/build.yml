
name: Island APK Builder

on:
  push:
    branches: [main, master]
    paths:
      - 'island-*.zip'
      - '**/island-*.zip'
  workflow_dispatch:
    inputs:
      archive:
        description: 'Island source ZIP filename'
        required: false
        default: 'island-v7-premium.zip'
        type: string

permissions:
  contents: read

concurrency:
  group: island-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Island V7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Find and extract V7 ZIP
        id: project
        shell: bash
        env:
          ARCHIVE_INPUT: ${{ inputs.archive }}
        run: |
          set -euo pipefail

          ARCHIVE="$ARCHIVE_INPUT"

          if [[ -z "$ARCHIVE" ]]; then
            mapfile -t FILES < <(
              git show --pretty='' --name-only "$GITHUB_SHA" |
              grep -Ei '(^|/)island-[^/]*\.zip$' || true
            )
            if (( ${#FILES[@]} > 0 )); then
              ARCHIVE="${FILES[-1]}"
            else
              ARCHIVE="$(find . -maxdepth 3 -iname 'island-*.zip' -type f | sort -V | tail -n 1)"
            fi
          fi

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "Island ZIP not found: $ARCHIVE"
            exit 1
          fi

          DEST="$RUNNER_TEMP/island-source"
          mkdir -p "$DEST"
          unzip -q "$ARCHIVE" -d "$DEST"

          mapfile -d '' SETTINGS < <(
            find "$DEST" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print0
          )

          if (( ${#SETTINGS[@]} != 1 )); then
            echo "Expected one Gradle settings file."
            exit 1
          fi

          PROJECT="$(dirname "${SETTINGS[0]}")"

          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/build.gradle" || \
            test -f "$PROJECT/app/build.gradle.kts"

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon --console=plain --stacktrace clean assembleDebug

      - name: Verify APK
        id: verify
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          {
            echo "## Island V7 build successful"
            echo "Version: 7.0"
            echo "Version code: 7"
            echo "SHA-256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V7 APK
        uses: actions/upload-artifact@v7
        with:
          name: Island-V7-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
