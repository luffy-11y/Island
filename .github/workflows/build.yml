
name: Island APK Builder

on:
  push:
    branches: [main, master]
    paths:
      - 'island-*.zip'
      - '**/island-*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      archive:
        description: 'Island source ZIP filename'
        required: false
        default: 'island-v7-premium.zip'
        type: string

permissions:
  contents: read

concurrency:
  group: island-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Island V7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Find and extract V7 source archive
        id: project
        shell: bash
        env:
          ARCHIVE_INPUT: ${{ inputs.archive }}
        run: |
          set -euo pipefail
          ARCHIVE="$ARCHIVE_INPUT"

          if [[ -z "$ARCHIVE" ]]; then
            mapfile -t CHANGED < <(
              git show --pretty='' --name-only "$GITHUB_SHA" \
                | grep -Ei '(^|/)island-[^/]*\.zip$' || true
            )
            if (( ${#CHANGED[@]} > 0 )); then
              ARCHIVE="${CHANGED[-1]}"
            else
              ARCHIVE="$(find . -maxdepth 3 -type f -iname 'island-*.zip' -print | sort -V | tail -n 1)"
            fi
          fi

          if [[ -z "$ARCHIVE" || ! -f "$ARCHIVE" ]]; then
            echo "Source ZIP not found: $ARCHIVE" >&2
            exit 1
          fi

          DEST="$RUNNER_TEMP/island-source"
          mkdir -p "$DEST"
          unzip -q "$ARCHIVE" -d "$DEST"

          mapfile -d '' SETTINGS < <(
            find "$DEST" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) -print0
          )

          if (( ${#SETTINGS[@]} != 1 )); then
            echo "Expected exactly one Gradle settings file; found ${#SETTINGS[@]}" >&2
            find "$DEST" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS[0]}")"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using archive: $ARCHIVE" >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --console=plain --stacktrace clean assembleDebug

      - name: Verify APK and checksum
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          {
            echo '## Island V7 APK build succeeded'
            echo ''
            echo "- SHA-256: $SHA256"
            echo '- Build type: debug'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Island-V7-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
