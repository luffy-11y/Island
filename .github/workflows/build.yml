name: Build APK
on:
  push:
    paths:
      - '*.zip'
      - '*.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Extract project
        run: |
          if ls *.html 1>/dev/null 2>&1; then
            python3 -c 'import re,base64,glob; f=sorted(glob.glob("*.html"))[-1]; m=re.search(r"B64_ZIP\s*=\s*\"([A-Za-z0-9+/=]+)\"", open(f).read()); open("island-v99.zip","wb").write(base64.b64decode(m.group(1)))'
          fi
          unzip -o "$(ls island-*.zip | sort -V | tail -1)" -d project
      - name: Build
        working-directory: project
        run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: project/app/build/outputs/apk/debug/app-debug.apk
